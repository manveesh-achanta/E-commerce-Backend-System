[project]
name = "e-commerce-backend-system"
version = "0.1.0"
description = "Role-based e-commerce backend built with FastAPI, SQLAlchemy 2.0, and PostgreSQL.More than 30 REST endpoints for customers, sellers, and admins, with JWT auth, transactional checkout, shipment tracking, reviews, returns, and a Pytest test suite."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.143.0",
    "psycopg2-binary>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "sqlalchemy[asyncio]>=2.1.4",
]
